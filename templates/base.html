<!doctype html>
<html lang="en">
<head>
  {% include "_seo.html" %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/md3.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="top-app-bar">
    <a class="brand" href="{{ url_for('home') }}">{{ config.SITE.name }}</a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ url_for('home') }}" {% if seo.path == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ url_for('content') }}" {% if seo.path.startswith('/guide') %}aria-current="page"{% endif %}>Guide</a>
      <a href="{{ url_for('about') }}" {% if seo.path == '/about' %}aria-current="page"{% endif %}>About</a>
    </nav>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>&copy; {{ config.SITE.name }}. All rights reserved.</p>
  </footer>
</body>
</html>
